services:

  openclaw:
    build:
      context: ./openclaw
    container_name: openclaw-agent
    ports:
      - "8000:8000"
    depends_on:
      - executor

  executor:
    build:
      context: ../host-executor
    container_name: host-executor
    privileged: true
    user: root
    ports:
      - "8001:8000"
    volumes:
      - D:/:/mnt/d
      - C:/:/mnt/c
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1

  whatsapp:
    build:
      context: ./whatsapp
    container_name: whatsapp-bridge
    depends_on:
      - openclaw
    ports:
      - "3000:3000"
