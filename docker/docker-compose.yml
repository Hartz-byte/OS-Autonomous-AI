version: "3.9"

services:

  openclaw:
    build:
      context: ./openclaw
    container_name: openclaw-agent
    ports:
      - "8000:8000"
    depends_on:
      - executor

  executor:
    build: .
    container_name: host-executor
    privileged: true
    network_mode: "host"
    volumes:
      - /:/host_root
      - D:/:/windows_drive
    environment:
      - PYTHONUNBUFFERED=1

  whatsapp:
    build:
      context: ./whatsapp
    container_name: whatsapp-bridge
    depends_on:
      - openclaw
    ports:
      - "3000:3000"
